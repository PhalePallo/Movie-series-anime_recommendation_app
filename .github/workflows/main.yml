name: Build & Deploy - MSA App (Free kind)

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build, Load & Deploy on kind
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU (for multi‑arch, optional)
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          tags: msa-app:latest
          build-args: |
            VITE_GEMINI_API_KEY=${{ secrets.BUILD_VITE_GEMINI_API_KEY }}

      - name: Set up kind cluster
        uses: kind-actions/setup-kind@v1 # updated action
        with:
          version: v0.20.0

      - name: Load Docker image into kind
        run: kind load docker-image msa-app:latest

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.30.0'

      - name: Deploy to Kubernetes (kind)
        run: |
          kubectl apply -f deployment.yaml
          kubectl apply -f service.yaml
          kubectl rollout status deployment/msa-app-deployment --timeout=120s

      - name: List pods & services
        run: |
          kubectl get pods --all-namespaces
          kubectl get svc --all-namespaces
