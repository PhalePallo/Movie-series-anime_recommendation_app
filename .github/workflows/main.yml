name: Build & Deploy - MSA App (Free Minikube/kind)

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build, Push & Deploy on kind
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Set up Docker Buildx
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # 3️⃣ Build Docker image (locally, no push)
      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          tags: msa-app:latest
          build-args: |
            VITE_GEMINI_API_KEY=${{ secrets.BUILD_VITE_GEMINI_API_KEY }}

      # 4️⃣ Set up kind (Kubernetes in Docker)
      - name: Set up kind
        uses: engineerd/setup-kind@v0.11.1
        with:
          version: v0.20.0

      # 5️⃣ Load image into kind cluster
      - name: Load image into kind
        run: kind load docker-image msa-app:latest

      # 6️⃣ Set up kubectl
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.30.0'

      # 7️⃣ Apply Kubernetes manifests
      - name: Deploy to kind
        run: |
          kubectl apply -f deployment.yaml
          kubectl apply -f service.yaml
          kubectl rollout status deployment/msa-app-deployment --timeout=120s

      # 8️⃣ Test service (optional)
      - name: Test deployment
        run: kubectl get pods && kubectl get svc
