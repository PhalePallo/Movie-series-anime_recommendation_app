name: Build & Deploy - MSA App (Free kind)

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build, Load & Deploy on kind
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU (optional for multi-arch)
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          tags: msa-app:latest
          build-args: |
            VITE_GEMINI_API_KEY=${{ secrets.BUILD_VITE_GEMINI_API_KEY }}

      - name: Set up kind cluster
        uses: engineerd/setup-kind@v0.6.0
        with:
          version: v0.20.0   # kind binary version; change if you want a different kind release
          wait: 300s

      - name: Load image into kind
        run: |
          kind load docker-image msa-app:latest

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.30.0'

      - name: Deploy to kind
        run: |
          kubectl apply -f deployment.yaml
          kubectl apply -f service.yaml
          kubectl rollout status deployment/msa-app-deployment --timeout=120s

      - name: Wait for service & show objects
        run: |
          kubectl get pods -o wide
          kubectl get svc -o wide

      - name: Test service via in-cluster curl pod
        run: |
          SVC_URL="http://msa-app-service.default.svc.cluster.local:80"
          echo "Testing service at $SVC_URL"
          kubectl run --rm -i --restart=Never curltest --image=curlimages/curl -- /bin/sh -c "sleep 2; echo 'GET /' ; curl -s -w '\nHTTP_STATUS:%{http_code}\n' $SVC_URL || exit 1"

      - name: Show pod logs (optional)
        run: |
          POD=$(kubectl get pods -l app=msa-app -o jsonpath='{.items[0].metadata.name}')
          echo "Showing logs for $POD"
          kubectl logs $POD || true
